name: Cypress - Bellatrix
on:
  workflow_dispatch:
  push:
    paths:
      - 'cypress/**'
      - 'cypress.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cypress-bellatrix.yml'
  pull_request:
    paths:
      - 'cypress/**'
      - 'cypress.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cypress-bellatrix.yml'
permissions:
  contents: read
jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run cy:run -- --reporter junit --reporter-options 'mochaFile=cypress/results/results-[hash].xml,toConsole=true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-bellatrix-evidencias
          path: |
            cypress/screenshots/
            cypress/videos/
            cypress/results/
          retention-days: 14
